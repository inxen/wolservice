# WOL secrets 文件说明
#
# 真实的 wol.secrets.yaml 由程序 AES-256-GCM 加密生成，不能手工编辑。
# 主密钥默认在构建时内嵌到二进制；也可以用环境变量 WOL_SECRETS_KEY 覆盖。
# 密钥丢失后，SSH/IoT 凭据需要重新填写。
#
# 解密后的逻辑分组如下（仅用于说明，不是可直接粘贴的文件格式）：
#
# config_panel:
#   password_hash: "$argon2id$v=19$..."    # 快速面板/API 与配置面板共享访问密码哈希
# devices:
#   <secret_ref>:                          # 默认等于设备 key，可由 secret_ref 覆盖
#     ssh:
#       password: "..."
#       private_key: "..."
#       passphrase: ""
#     iot:
#       bemfa_secret_key: "..."
#       blinker_auth_key: "..."
#
# 设置/修改凭据请使用 http://<主机>:8090/config。
# 备份时请把 wol.secrets.key 与加密文件分开保护；两者一起泄露等于没有加密。
