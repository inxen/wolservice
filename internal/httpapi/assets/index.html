<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b1220">
  <meta name="referrer" content="no-referrer">
  <title>{{TITLE}}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/assets/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/apple-touch-icon-120.png">
  <!-- iOS 独立窗口：安卓读 manifest，iOS 读下面这几个 meta 和 apple-touch-icon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{TITLE}}">
  <meta name="format-detection" content="telephone=no">
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0-14.9-4M4 4v5h5M4 13a8.1 8.1 0 0 0 14.9 4M20 20v-5h-5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18Z" fill="currentColor"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8.5 8.5 0 1 0 11.4 0"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 8.5a15 15 0 0 1 19 0M5.5 12a10.5 10.5 0 0 1 13 0M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M2.5 8.5a15 15 0 0 1 4.2-2.3M8.5 15.5a6 6 0 0 1 7 0M5.5 12a10.4 10.4 0 0 1 3-1.7M15.7 10.5a10.5 10.5 0 0 1 2.8 1.5M17.5 6.3a15 15 0 0 1 4 2.2"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v5"/><circle cx="12" cy="17.3" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-devices" viewBox="0 0 24 24"><rect x="2.5" y="5" width="13" height="10" rx="1.8"/><path d="M6 19h6M9 15v4"/><rect x="17" y="9" width="4.5" height="10" rx="1.2"/></symbol>
    <symbol id="i-router" viewBox="0 0 24 24"><rect x="3" y="12.5" width="18" height="7" rx="2"/><path d="M6.5 16h.01M9.5 16h.01M12 3v3M8.5 6.5 7 5M15.5 6.5 17 5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.5 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.2.37.5.7.9.93.3.17.7.26 1.1.26H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.81Z"/></symbol>
  </svg>

  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><svg><use href="#i-bolt"/></svg></div>
        <div class="brand-text">
          <h1 id="appTitle">{{TITLE}}</h1>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="langButton" type="button" title="切换语言 / Language" aria-label="切换语言">
          <span id="langLabel">EN</span>
        </button>
        <button class="icon-btn" id="themeButton" type="button" title="切换主题 / Theme" aria-label="切换主题">
          <svg id="themeIcon"><use href="#i-auto"/></svg>
        </button>
        <a class="icon-btn" id="configLink" href="/config" title="配置" aria-label="配置" hidden>
          <svg><use href="#i-settings"/></svg>
        </a>
      </div>
    </header>

    <section class="device-board" aria-label="设备">
      <div class="device-grid" id="deviceGrid" aria-live="polite"></div>

      <div class="state-panel" id="statePanel" hidden>
        <div class="state-icon"><svg><use href="#i-router"/></svg></div>
        <h2 id="stateTitle">正在加载</h2>
        <p id="stateCopy">正在读取设备列表…</p>
        <button class="btn primary" id="stateRetry" type="button" hidden>重试</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="confirmModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <button class="modal-close" id="confirmClose" type="button" aria-label="关闭"><svg><use href="#i-x"/></svg></button>
      <div class="modal-icon" id="confirmIcon"><svg><use href="#i-power"/></svg></div>
      <h2 id="confirmTitle">确认操作</h2>
      <p id="confirmCopy"></p>
      <div class="modal-actions">
        <button class="btn ghost" id="confirmCancel" type="button">取消</button>
        <button class="btn danger" id="confirmOk" type="button">确认</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="tokenModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tokenTitle">
      <button class="modal-close" id="tokenClose" type="button" aria-label="关闭"><svg><use href="#i-x"/></svg></button>
      <div class="modal-icon"><svg><use href="#i-lock"/></svg></div>
      <h2 id="tokenTitle">访问密码</h2>
      <p id="tokenCopy">请输入访问密码继续。</p>
      <input class="text-input" id="tokenInput" type="password" autocomplete="current-password" placeholder="访问密码">
      <p class="modal-error" id="tokenError" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="tokenClear" type="button">退出登录</button>
        <button class="btn primary" id="tokenSave" type="button">登录</button>
      </div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
</body>
</html>
